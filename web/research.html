<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b11">
  <meta name="description" content="经纬：公开研究报告与论文的元数据、摘要与原文链接。">
  <title>研究报告与论文 · 经纬</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/research.css?v=1.0.0">
</head>
<body class="research-page">
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar research-topbar">
    <a class="brand" href="/" aria-label="返回经纬首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" role="img">
          <circle cx="20" cy="20" r="15.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <ellipse cx="20" cy="20" rx="7" ry="15.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4.8 20h30.4M7.4 12.2h25.2M7.4 27.8h25.2" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="29.5" cy="12.5" r="2.6" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>经纬</strong>
        <span>RESEARCH / REPORTS</span>
      </span>
    </a>
    <div class="top-actions">
      <a class="text-btn" href="https://github.com/ybw-ly/global-research-timeline" target="_blank" rel="noopener">GitHub ↗</a>
      <button class="button ghost" type="button" id="research-refresh">刷新元数据</button>
    </div>
  </header>

  <main class="research-main">
    <section class="research-hero">
      <div>
        <span class="eyebrow">PUBLIC RESEARCH / PHASE 1</span>
        <h1>研究报告与论文</h1>
        <p>只收录公开元数据、摘要、作者/机构、日期、DOI 或报告号和原文链接；不下载全文 PDF。</p>
      </div>
      <div class="research-stats" id="research-stats" aria-live="polite"></div>
    </section>

    <section class="research-toolbar" aria-label="筛选">
      <label class="research-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.2 4.2"/></svg>
        <input id="research-q" type="search" placeholder="搜索标题、摘要、作者、机构、主题…" autocomplete="off" spellcheck="false">
      </label>
      <select id="research-source" aria-label="来源">
        <option value="">全部来源</option>
      </select>
      <select id="research-days" aria-label="时间范围">
        <option value="30">最近 30 天</option>
        <option value="90" selected>最近 90 天</option>
        <option value="365">最近 1 年</option>
        <option value="3650">全部</option>
      </select>
      <div class="research-types" id="research-types" role="group" aria-label="类型">
        <button type="button" class="active" data-doc-type="">全部</button>
        <button type="button" data-doc-type="paper">论文</button>
        <button type="button" data-doc-type="report">报告</button>
      </div>
    </section>

    <section class="research-sources" id="research-sources" aria-label="来源状态"></section>

    <section class="research-list" id="research-list" aria-live="polite"></section>
    <div class="research-more-wrap" id="research-more-wrap" hidden>
      <button class="button ghost" type="button" id="research-more">加载更多</button>
    </div>
  </main>

  <div class="toast" id="research-toast" role="status" aria-live="polite" hidden></div>
  <script src="/research.js?v=1.0.0" defer></script>
</body>
</html>
